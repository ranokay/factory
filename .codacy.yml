---
# The Periphery skills are vendored byte-for-byte upstream copies pinned in
# skills.lock, so their frontmatter cannot carry Factory attribution; Own Skills
# stay analyzed.
exclude_paths:
  - "skills/periphery-scan/**"
  - "skills/periphery-scan-setup/**"
  # CLAUDE.md is a tracked symlink to AGENTS.md; scanning both reports the same instructions twice.
  - "CLAUDE.md"
# The asset driver is one self-contained file so the hk Gate can inline it and
# a repository that amends the Profile by URL needs no scripts checkout. It is
# deliberately long and branchy. ESLint still scans it; opengrep and lizard only
# report false positives for a CLI that reads repository-controlled paths.
# Run tools invoke Git and caller-selected commands through argv lists, never a shell.
# https://docs.python.org/3/library/subprocess.html#subprocess.run
engines:
  agentlinter:
    exclude_paths:
      - "AGENTS.md"
      - "CLAUDE.md"
  bandit:
    exclude_paths:
      - "tools/check_result.py"
      - "tools/run_guard.py"
      - "tools/tests/test_check_result.py"
      - "tools/tests/test_run_guard.py"
      - "tools/tests/test_run_targets.py"
  opengrep:
    exclude_paths:
      - "profiles/universal/scripts/assets.js"
      - "profiles/apple/scripts/assets.js"
      - "profiles/web/scripts/assets.js"
      - "profiles/universal/tests/assets-test.js"
      - "tools/check_result.py"
      - "tools/run_guard.py"
      - "tools/tests/test_check_result.py"
      - "tools/tests/test_run_guard.py"
      - "tools/tests/test_run_targets.py"
  # The shell lexer and Stop handler are protocol state machines; branch count is intentional.
  prospector:
    exclude_paths:
      - "tools/shell_parser.py"
      - "tools/run_guard.py"
  lizard:
    exclude_paths:
      - "profiles/universal/scripts/assets.js"
      - "profiles/apple/scripts/assets.js"
      - "profiles/web/scripts/assets.js"
      - "profiles/universal/tests/assets-test.js"

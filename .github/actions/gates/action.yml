name: Gates
description: Run one group of the calling repository's Gates with mise.
inputs:
  group:
    description: 'The Gates group to run: lint, security or test.'
    required: true
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        version: 2026.11.10
        cache: true
    - name: Set Trivy cache date
      if: inputs.group == 'security'
      id: trivy-cache-date
      shell: bash
      run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
    - name: Cache Trivy databases
      if: inputs.group == 'security'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/trivy
        key: ${{ runner.os }}-trivy-${{ steps.trivy-cache-date.outputs.date }}
        restore-keys: |
          ${{ runner.os }}-trivy-
    - name: Run ${{ inputs.group }} Gates
      shell: bash
      env:
        GROUP: ${{ inputs.group }}
        GITHUB_TOKEN: ${{ inputs.group != 'lint' && github.token || '' }}
      run: mise run "check:$GROUP"

name: OCR
description: Review a same-repository pull request with OpenCodeReview.
inputs:
  opencode_zen_api_key:
    description: OpenCode Zen API key used for the review model.
    required: false
  rule:
    description: Path to the OCR rules JSON; falls back to <workspace>/ai-review-rule.json.
    required: false
    default: ''
  # These mirror the Review step's defaults. They exist so the restyle step
  # classifies findings with the same routing policy the Review step used and
  # labels the footer with the same effort. The defaults keep the Review step's
  # checkpoint fingerprint byte-identical; a caller that overrides them changes
  # both steps together. The action tests pin each default and the wiring.
  route_severity_below:
    description: Severity threshold the Review and restyle steps route to the summary.
    required: false
    default: medium
  route_categories:
    description: Categories the Review and restyle steps route to the summary.
    required: false
    default: style,documentation
  effort:
    description: Review effort used by the Review step and recorded in the restyled footer.
    required: false
    default: high
runs:
  using: composite
  steps:
    - name: Require Console key
      shell: bash
      env:
        ZEN_KEY: ${{ inputs.opencode_zen_api_key }}
      run: |
        if [ -z "$ZEN_KEY" ]; then
          echo '::error::Missing OPENCODE_ZEN_API_KEY'
          exit 1
        fi
    - name: Resolve rule path
      id: rule
      shell: bash
      env:
        RULE: ${{ inputs.rule }}
        DEFAULT_RULE: ${{ format('{0}/ai-review-rule.json', github.workspace) }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        if [ -n "$RULE" ]; then
          case "$RULE" in
            /*) path="$RULE" ;;
            *) path="$WORKSPACE/$RULE" ;;
          esac
          if [ ! -f "$path" ]; then
            echo "::error::rule input does not exist: $RULE"
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
        elif [ -f "$DEFAULT_RULE" ]; then
          echo "path=$DEFAULT_RULE" >> "$GITHUB_OUTPUT"
        fi
    - name: Gather review context
      id: context
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const query = `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $number) {
                title
                closingIssuesReferences(first: 100, after: $cursor) {
                  nodes { number title body url }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }`;
          let cursor = null;
          let background = '';
          do {
            const data = await github.graphql(query, {owner: context.repo.owner, repo: context.repo.repo, number: context.issue.number, cursor});
            const pr = data.repository.pullRequest;
            // The PR body changes when evidence is attached, and OCR
            // fingerprints this input; leave the body out so the checkpoint
            // survives that edit. See OCR_FP_BACKGROUND in
            // https://github.com/alibaba/open-code-review/blob/d29ca2044a42ea297a7fa93692d0f5ac8f38d84e/action.yml
            if (!background) background = `PR: ${pr.title}`;
            for (const issue of pr.closingIssuesReferences.nodes) {
              background += `\n\nIssue ${issue.url}: ${issue.title}\n${issue.body || ''}`;
            }
            cursor = pr.closingIssuesReferences.pageInfo.hasNextPage ? pr.closingIssuesReferences.pageInfo.endCursor : null;
          } while (cursor);
          core.setOutput('background', background);
    - name: Review
      id: review
      uses: alibaba/open-code-review@d29ca2044a42ea297a7fa93692d0f5ac8f38d84e # v1.14.0
      with:
        ocr_version: 1.14.0
        llm_url: https://opencode.ai/inference/openai/v1
        llm_model: deepseek-v4.1-flash
        llm_use_anthropic: 'false'
        llm_protocol: openai
        llm_auth_token: ${{ inputs.opencode_zen_api_key }}
        # A per-run value here changes the checkpoint fingerprint, so the
        # session stays stable across a PR's pushes. See OCR_FP_LLM_EXTRA_HEADERS
        # in
        # https://github.com/alibaba/open-code-review/blob/d29ca2044a42ea297a7fa93692d0f5ac8f38d84e/action.yml
        llm_extra_headers: x-opencode-session=ses-${{ github.repository_id }}-${{ github.event.pull_request.number }}
        background: ${{ steps.context.outputs.background }}
        # OCR resolves a rule file's nested REVIEW.md against the JSON's
        # directory and rejects a bare filename as escaping the repo root, so
        # pass the workspace-qualified path. See tryReadRuleFile in
        # https://github.com/alibaba/open-code-review/blob/d29ca2044a42ea297a7fa93692d0f5ac8f38d84e/internal/config/rules/system_rules.go
        rule: ${{ steps.rule.outputs.path }}
        sticky_summary: 'true'
        incremental: 'true'
        checkpoint_range: 'true'
        route_severity_below: ${{ inputs.route_severity_below }}
        route_categories: ${{ inputs.route_categories }}
        resolve_outdated: 'true'
        effort: ${{ inputs.effort }}
        # The checkpoint travels in the sticky summary comment, not in
        # uploaded artifacts. See the checkpoint outputs in
        # https://github.com/alibaba/open-code-review/blob/d29ca2044a42ea297a7fa93692d0f5ac8f38d84e/action.yml
        upload_artifacts: 'false'
    - name: Require published review
      shell: bash
      env:
        SUMMARY: ${{ steps.review.outputs.summary_comment_url }}
        RANGE_REASON: ${{ steps.review.outputs.range_reason }}
        RESULT_PATH: /tmp/ocr-result.json
      run: |
        # A same-head rerun reviews an empty range and deliberately leaves the
        # existing summary in place, so it publishes no new URL. See the
        # range_reason output in
        # https://github.com/alibaba/open-code-review/blob/d29ca2044a42ea297a7fa93692d0f5ac8f38d84e/action.yml
        if [ -z "$SUMMARY" ] && [ "$RANGE_REASON" != "same_head_noop" ]; then
          echo '::error::Review summary publication failed'
          exit 1
        fi
        python3 -c 'import json, os, sys; result = json.load(open(os.environ["RESULT_PATH"])); sys.exit(result.get("status") not in ("complete", "skipped"))'
    - name: Restyle review comments
      # OCR has no template hook, so rewrite its sticky summary and this run's
      # inline comments after it posts. Every hidden marker is preserved, which
      # keeps checkpoint_range, incremental and resolve_outdated working. A
      # failure restores whatever was already written and only warns: never
      # fail the job and never lose a finding. The step lives beside this
      # action so a caller that uses the action remotely still has it, and
      # github.action_path resolves it without this repository's workspace.
      # A caller must grant pull-requests: write (with issues: read) for the
      # PATCHes; a read-only token leaves each rewrite warning and OCR's
      # comments in place. See
      # https://docs.github.com/actions/using-jobs/assigning-permissions-to-jobs
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        OCR_RESULT: /tmp/ocr-result.json
        OCR_RANGE_REASON: ${{ steps.review.outputs.range_reason }}
        OCR_RANGE_FROM: ${{ steps.review.outputs.range_from }}
        OCR_RANGE_TO: ${{ steps.review.outputs.range_to }}
        OCR_INLINE: ${{ steps.review.outputs.comments_inline }}
        OCR_SKIPPED: ${{ steps.review.outputs.comments_skipped }}
        OCR_ROUTE_SEVERITY_BELOW: ${{ inputs.route_severity_below }}
        OCR_ROUTE_CATEGORIES: ${{ inputs.route_categories }}
        OCR_EFFORT: ${{ inputs.effort }}
        OCR_SCRIPT: ${{ github.action_path }}/restyle.py
      run: |
        set +e
        python3 "$OCR_SCRIPT"
        status=$?
        if [ "$status" -ne 0 ]; then
          echo "::warning::OCR restyle exited $status; OCR's original comments were left in place"
        fi
        exit 0

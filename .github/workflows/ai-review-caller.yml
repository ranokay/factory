name: AI Review
run-name: AI Review PR ${{ github.event.pull_request.number }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    permissions:
      # The callee resolves outdated bot threads, so the caller grants it
      # repository write access. See
      # https://github.com/alibaba/open-code-review/blob/d29ca2044a42ea297a7fa93692d0f5ac8f38d84e/action.yml
      contents: write
      issues: read
      pull-requests: write
    uses: $/.github/workflows/ai-review.yml
    secrets:
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}

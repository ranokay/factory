name: AI Review
run-name: AI Review PR ${{ github.event.pull_request.number }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    name: OCR PR Review
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.login == 'ranokay' || github.event.pull_request.user.login == 'renovate[bot]') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # resolve_outdated resolves outdated bot threads, which GitHub gates on
      # repository write access rather than the pull-requests scope. See
      # https://github.com/alibaba/open-code-review/blob/d29ca2044a42ea297a7fa93692d0f5ac8f38d84e/action.yml
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review
        uses: ./.github/actions/ocr-review # zizmor: ignore[self-repository] -- Codacy does not understand the self-repository form
        with:
          opencode_zen_api_key: ${{ secrets.OPENCODE_ZEN_API_KEY }}

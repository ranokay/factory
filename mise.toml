min_version = "2026.11.10"

include = ["./profiles/universal/mise.toml"]

[tools]
python = "3.13.18"
uv = "0.11.27"
ffmpeg = "9.0.2"
"npm:ctx7" = "0.12.2"

[task_config]
includes = ["profiles/universal/tasks.toml"]

[tasks."skills:sync"]
description = "Sync Vendored Skills at their pins; --check, --check --fetch or --update"
run = "uv run scripts/skills-sync.py"

[tasks.bootstrap]
description = "Link this Mac's harness config to the Factory and verify discovery"
run = "uv run --offline --no-project --no-config --python 3.13.18 python scripts/bootstrap.py"

[tasks."bootstrap:check"]
description = "Verify every harness sees the Factory global instructions and skills"
run = "uv run --offline --no-project --no-config --python 3.13.18 python scripts/bootstrap.py --check"

[tasks."bootstrap:test"]
description = "Run the bootstrap tests"
run = "hk test --step bootstrap"

[tasks."tools:test"]
description = "Run the agent hook helper tests"
run = "uv run --offline --no-project --no-config --python 3.13.18 python -m unittest discover -s tools/tests"

[tasks.evidence]
description = "Record Verification Evidence and post the single PR evidence comment"
run = "./skills/evidence/scripts/evidence"

[tasks.check]
description = "Run every Gate"
depends = [
  "skills:test",
  "run-slot:test",
  "block-issue:test",
  "file-promotion:test",
  "process-receipt:test",
  "evidence:test",
  "bootstrap:test",
  "tools:test",
]

[tasks."skills:test"]
description = "Run the skills:sync tests"
run = "hk test --step skills-sync"

[tasks."run-slot:test"]
description = "Run the full-send run-slot tests"
run = "hk test --step run-slot"

[tasks."block-issue:test"]
description = "Run the block-issue tests"
run = "hk test --step block-issue"

[tasks."file-promotion:test"]
description = "Run the file-promotion tests"
run = "hk test --step file-promotion"

[tasks."process-receipt:test"]
description = "Run the process-receipt tests"
run = "hk test --step process-receipt"

[tasks."evidence:test"]
description = "Run the evidence CLI tests"
run = "hk test --step evidence"

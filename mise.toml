min_version = "2026.11.10"

include = ["./profiles/universal/mise.toml"]

[tools]
python = "3.13.18"
uv = "0.11.27"
ffmpeg = "9.0.2"
"npm:ctx7" = "0.12.2"
"npm:rea-agents" = "6.5.0"
# re2's native module must build so the Gate evaluates regexes with RE2 (https://github.com/renovatebot/renovate/blob/44.257.9/lib/util/regex.ts), and @yarnpkg/libzip@3.2.2 is a Yarn-published transitive without provenance (https://github.com/yarnpkg/berry); move the exemption when a Renovate update changes libzip.
"npm:renovate" = { version = "44.257.9", allow_builds = ["re2"], trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }

[task_config]
includes = ["profiles/universal/tasks.toml"]

[tasks."skills:sync"]
description = "Sync Vendored Skills at their pins; --check, --check --fetch or --update"
run = "uv run scripts/skills-sync.py"

[tasks.bootstrap]
description = "Link this Mac's harness config to the Factory and verify discovery"
run = "uv run --offline --no-project --no-config --python \"$(mise which python)\" python scripts/bootstrap.py"

[tasks."bootstrap:check"]
description = "Verify every harness sees the Factory global instructions and skills"
run = "uv run --offline --no-project --no-config --python \"$(mise which python)\" python scripts/bootstrap.py --check"

[tasks."bootstrap:test"]
description = "Run the bootstrap tests"
run = "hk test --step bootstrap"

[tasks."mcp:test"]
description = "Run the MCP registry renderer and secrets agent tests"
run = "hk test --step mcp-sync"

[tasks."gitleaks:test"]
description = "Run the gitleaks rule and repository scan tests"
run = "hk test --step gitleaks"

[tasks."tools:test"]
description = "Run the agent hook helper tests"
run = "./tools/run tests"

[tasks.evidence]
description = "Record Verification Evidence and post the single PR evidence comment"
run = "./skills/evidence/scripts/evidence"

[tasks.repo-settings]
description = "Compare or reconcile repository settings"
run = "uv run --offline --no-project --no-config --python \"$(mise which python)\" python scripts/repo-settings.py"

[tasks.gc]
description = "Prune stale Factory data and tool caches"
run = "uv run --offline --no-project --no-config --python \"$(mise which python)\" python scripts/gc.py --notify"

[tasks."gc:test"]
description = "Run GC fixture tests"
run = "hk test --step gc"

[tasks."verify:maintain"]
description = "File weekly maintenance issues for repos whose app changed since its verify skill"
run = "uv run --offline --no-project --no-config --python \"$(mise which python)\" python scripts/verify-maintenance.py"

[tasks."verify-skill:test"]
description = "Run the verify-skill shape fixture tests"
run = "hk test --step verify-skill"

[tasks."verify-maintenance:test"]
description = "Run the weekly verify maintenance fixture tests"
run = "hk test --step verify-maintenance"

[tasks."canonical-clones"]
description = "Report or migrate canonical clones"
run = "uv run --offline --no-project --no-config --python \"$(mise which python)\" python scripts/canonical-clones.py"

[tasks."canonical-clones:test"]
description = "Run canonical clone fixture tests"
run = "hk test --step canonical-clones"

[tasks.check]
description = "Run every Gate"
depends = [
  "check:codacy",
  "skills:test",
  "profiles:test",
  "profiles:fixtures",
  "run-slot:test",
  "block-issue:test",
  "file-promotion:test",
  "process-receipt:test",
  "evidence:test",
  "pr-text:test",
  "bootstrap:test",
  "gc:test",
  "verify-skill:test",
  "verify-maintenance:test",
  "canonical-clones:test",
  "mcp:test",
  "gitleaks:test",
  "tools:test",
  "workflow-invariant:test",
  "advisory-review-requests:test",
  "repo-settings:test",
  "codacy-gate:test",
  "sync-upstream:test",
]

[tasks."check:gates"]
description = "Run the Factory's shared Gates"
run = ["hk check --all", "hk test --step comment-ban", "hk test --step pinact"]

[tasks."workflow-invariant:test"]
run = "hk test --step workflow-invariant-test"

[tasks."advisory-review-requests:test"]
run = "hk test --step advisory-review-requests"

[tasks."repo-settings:test"]
run = "hk test --step repo-settings-test"

[tasks."codacy-gate:test"]
run = "hk test --step codacy-gate-test"

[tasks."sync-upstream:test"]
description = "Run the sync-upstream fixture tests"
run = "hk test --step sync-upstream-test"

[tasks."skills:test"]
description = "Run the skills:sync tests"
run = "hk test --step skills-sync"

[tasks."profiles:test"]
description = "Run the Profiles declaration tests"
run = "hk test --step profiles"

[tasks."profiles:fixtures"]
description = "Run each Profile fixture in an isolated repository"
run = "sh scripts/profiles-fixtures.sh"

[tasks."run-slot:test"]
description = "Run the full-send run-slot tests"
run = "hk test --step run-slot"

[tasks."block-issue:test"]
description = "Run the block-issue tests"
run = "hk test --step block-issue"

[tasks."file-promotion:test"]
description = "Run the file-promotion tests"
run = "hk test --step file-promotion"

[tasks."process-receipt:test"]
description = "Run the process-receipt tests"
run = "hk test --step process-receipt"

[tasks."evidence:test"]
description = "Run the evidence CLI tests"
run = "hk test --step evidence"

[tasks."pr-text:test"]
description = "Run the PR text checker fixture tests"
run = "hk test --step pr-text"

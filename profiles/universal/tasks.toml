[assets]
description = "Generate every brand export from assets/brand masters"
usage = '''
flag "--check" help="Verify the lock and regenerate without writing"
'''
run = '''
factory=${FACTORY_CHECKOUT:-}
if [ -z "$factory" ]; then
  factory=$HOME/.agents
  [ -f "$factory/profiles/universal/scripts/assets.js" ] || factory=$HOME/Developer/factory
fi
ref=$(grep -io 'factory\.git//profiles/universal/mise\.toml?ref=[^"]*' mise.toml 2>/dev/null | head -n 1 | sed 's/.*ref=//')
if [ -n "$ref" ]; then
  tmp=$(mktemp -d "${TMPDIR:-/tmp}/factory-assets.XXXXXX")
  trap 'rm -rf "$tmp"' EXIT HUP INT TERM
  mkdir -p "$tmp/profiles/universal/scripts" "$tmp/profiles/apple/scripts" "$tmp/profiles/web/scripts"
  for file in universal/scripts/assets.js universal/scripts/asset-masters.js apple/scripts/assets.js web/scripts/assets.js; do
    git -C "$factory" show "$ref:profiles/$file" > "$tmp/profiles/$file" || {
      printf 'assets: %s does not carry profiles/%s; fetch the pinned tag or re-pin the Factory to a release with the assets task\n' "$ref" "$file" >&2
      exit 1
    }
  done
  exec node "$tmp/profiles/universal/scripts/assets.js"{% if usage.check %} --check{% endif %}
fi
[ -f "$factory/profiles/universal/scripts/assets.js" ] || {
  printf '%s\n' 'assets: set FACTORY_CHECKOUT to the Factory checkout' >&2
  exit 1
}
exec node "$factory/profiles/universal/scripts/assets.js"{% if usage.check %} --check{% endif %}
'''

["check"]
description = "Run every Gate"
depends = ["check:lint", "check:security", "check:test"]

["check:lint"]
description = "Run the Lint group"
run = "hk run lint --all"

["check:security"]
description = "Run the Security group and the local Codacy gate"
depends = ["check:codacy"]
run = "hk run security --all"

["check:test"]
description = "Run the Tests group and every step fixture"
run = ["hk run tests --all", "hk test"]

["check:gates"]
description = "Run every hk step"
run = ["hk check --all"]

["check:codacy"]
description = "Run local Codacy analysis for private repositories"
run = '''
set -eu
private=$(gh repo view --json isPrivate --jq .isPrivate)
case "$private" in
  false) printf '%s\n' 'Public repository: Codacy cloud check applies'; exit 0 ;;
  true) ;;
  *) printf '%s\n' 'Unable to determine repository visibility' >&2; exit 1 ;;
esac
config=$(mktemp /tmp/factory-codacy.XXXXXXXX)
trap 'rm -f "$config"' EXIT HUP INT TERM
codacy-analysis init . --auto --dry-run --no-update-notifier > "$config"
if ! yq -e -p=json '.tools | length > 0' "$config" >/dev/null; then
  printf '%s\n' 'Codacy selected zero tools for this private repository' >&2
  exit 1
fi
codacy-analysis analyze . --config-file "$config" --install-dependencies --no-log --no-update-notifier
'''

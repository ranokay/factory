<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <pattern id="p" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0f172a"/>
    </pattern>
    <mask id="m"><rect width="256" height="256" fill="#ffffff"/></mask>
    <filter id="f"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="c"><rect width="128" height="128"/></clipPath>
  </defs>
  <rect width="256" height="256" fill="url(#p)" mask="url(#m)" filter="url(#f)" clip-path="url(#c)"/>
</svg>

min_version = "2026.11.10"

include = ["git::https://github.com/ranokay/factory.git//profiles/universal/mise.toml?ref=v0.5.0"]

[settings]
experimental = true

[task_config]
includes = ["git::https://github.com/ranokay/factory.git//profiles/universal/tasks.toml?ref=v0.5.0"]

[tasks.check]
description = "Run every Gate and record the clean HEAD result"
run = '''
uv run --script https://raw.githubusercontent.com/ranokay/factory/v0.5.0/tools/check_result.py -- sh -c 'mise run check:lint && mise run check:security && mise run check:test'
'''

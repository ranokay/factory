<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<style>
  :root {
    color-scheme: light dark;
    --page-fg: var(--foreground, #17171a);
    --page-muted: var(--muted-foreground, #6b6b73);
    --page-card: var(--card, #ffffff);
    --page-border: var(--border, #e6e6ea);
    --page-chip: var(--secondary, #f1f1f4);
    --page-radius: var(--radius, 12px);
    --page-font: var(--font-sans, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--page-font);
    color: var(--page-fg);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1180px; margin: 0 auto; padding: 8px 8px 48px; }
  .masthead { padding: 22px 4px 0; }
  .kicker {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--page-muted);
  }
  .kicker::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--page-fg);
    opacity: .8;
  }
  h1 {
    margin: 0;
    font-size: clamp(26px, 3.4vw, 36px);
    line-height: 1.08;
    letter-spacing: -.025em;
    font-weight: 650;
  }
  .lede {
    max-width: 660px;
    margin: 12px 0 0;
    font-size: 15px;
    color: var(--page-muted);
  }
  .index {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 22px;
  }
  .index-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border: 1px solid var(--page-border);
    border-radius: calc(var(--page-radius) + 2px);
    background: var(--page-card);
    color: inherit;
    text-decoration: none;
  }
  .index-card:hover { border-color: var(--page-muted); }
  .index-copy { display: flex; flex-direction: column; min-width: 0; }
  .index-copy strong { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .index-copy span {
    overflow: hidden;
    font-size: 11px;
    color: var(--page-muted);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .concept { padding-top: 42px; }
  .concept-head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 0 4px 16px;
  }
  .number {
    flex: 0 0 auto;
    margin-top: 2px;
    padding: 4px 7px;
    border: 1px solid var(--page-border);
    border-radius: 7px;
    color: var(--page-muted);
    font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    font-size: 10px;
    letter-spacing: .06em;
  }
  .concept-head h2 {
    margin: 0;
    font-size: 20px;
    line-height: 1.2;
    letter-spacing: -.015em;
    font-weight: 620;
  }
  .metaphor { margin: 3px 0 0; font-size: 13px; color: var(--page-muted); }
  .head-mark { margin-left: auto; }
  .boards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .board {
    position: relative;
    padding: 14px 14px 16px;
    border: 1px solid;
    border-radius: calc(var(--page-radius) + 8px);
  }
  .board-light { background: #f6f6f3; color: #18181b; border-color: #e7e7e2; }
  .board-dark { background: #0e0e11; color: #f4f4f5; border-color: #26262b; }
  .rail-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .55;
  }
  .toggle { cursor: pointer; letter-spacing: 0; text-transform: none; text-decoration: underline; text-underline-offset: 2px; }
  .sizes-toggle { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .when-on { display: none; }
  .sizes-toggle:checked ~ .rail-head .when-off { display: none; }
  .sizes-toggle:checked ~ .rail-head .when-on { display: inline; }
  .sizes-toggle:checked ~ .rail {
    height: auto;
    max-height: none;
    flex-wrap: wrap;
    overflow-x: hidden;
    overflow-y: hidden;
  }
  .sizes-toggle:checked ~ .rail-hint { display: none; }
  .board:has(.sizes-toggle:checked) { grid-column: 1 / -1; }
  .board-label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    opacity: .55;
  }
  .board-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .rail {
    display: flex;
    align-items: flex-end;
    gap: 20px;
    height: 288px;
    padding: 8px 2px 10px;
    overflow: auto;
    scrollbar-width: thin;
    border-bottom: 1px solid rgba(0, 0, 0, .08);
  }
  .board-dark .rail { border-bottom-color: rgba(255, 255, 255, .1); }
  .size {
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    margin: 0;
  }
  .size figcaption {
    color: currentColor;
    font-size: 10px;
    letter-spacing: .02em;
    opacity: .55;
    white-space: nowrap;
  }
  .mark { display: inline-flex; flex: 0 0 auto; }
  .mark svg { display: block; width: 100%; height: 100%; }
  .rail-hint { margin: 7px 0 0; font-size: 10px; opacity: .45; }
  .menu {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 30px;
    margin-top: 12px;
    padding: 0 9px;
    border-radius: 8px;
    background: rgba(0, 0, 0, .05);
    font-size: 10.5px;
    white-space: nowrap;
  }
  .board-dark .menu { background: rgba(255, 255, 255, .08); }
  .menu-left, .menu-right { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .menu-left b { font-weight: 600; }
  .menu-left span { opacity: .6; }
  .menu-right { font-variant-numeric: tabular-nums; opacity: .65; }
  .template svg { filter: brightness(0); }
  .board-dark .template svg { filter: brightness(0) invert(1); }
  .browser {
    margin-top: 9px;
    overflow: hidden;
    border: 1px solid rgba(0, 0, 0, .09);
    border-radius: 10px;
    background: rgba(255, 255, 255, .55);
  }
  .board-dark .browser { border-color: rgba(255, 255, 255, .1); background: rgba(255, 255, 255, .04); }
  .tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 6px 0; }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    padding: 5px 9px;
    border-radius: 7px 7px 0 0;
    font-size: 10.5px;
    opacity: .5;
    white-space: nowrap;
  }
  .tab span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .tab.active { background: #ffffff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); opacity: 1; }
  .board-dark .tab.active { background: #1c1c21; box-shadow: 0 0 0 1px rgba(255, 255, 255, .08); }
  .address { padding: 6px 9px 8px; }
  .address span {
    display: inline-block;
    max-width: 100%;
    padding: 4px 10px;
    overflow: hidden;
    border-radius: 99px;
    background: rgba(0, 0, 0, .06);
    color: inherit;
    font-size: 10px;
    opacity: .55;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .board-dark .address span { background: rgba(255, 255, 255, .08); }
  .dock {
    display: flex;
    align-items: flex-end;
    gap: 9px;
    width: fit-content;
    max-width: 100%;
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 16px;
    background: rgba(0, 0, 0, .05);
  }
  .board-dark .dock { background: rgba(255, 255, 255, .09); }
  .app {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 650;
    letter-spacing: -.02em;
  }
  .app-a { background: linear-gradient(145deg, #f97316, #dc2626); }
  .app-b { background: linear-gradient(145deg, #22c55e, #0d9488); }
  .app-c { background: linear-gradient(145deg, #3b82f6, #6d28d9); }
  .app-d { background: linear-gradient(145deg, #eab308, #ca8a04); }
  .brand-app {
    width: 64px;
    height: 64px;
    border-radius: 15px;
    background: rgba(255, 255, 255, .35);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
  }
  .board-dark .brand-app { background: rgba(255, 255, 255, .1); box-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
  .board-note { margin: 10px 0 0; font-size: 10px; letter-spacing: .01em; opacity: .5; }
  .footer {
    margin-top: 46px;
    padding: 18px 4px 0;
    border-top: 1px solid var(--page-border);
    color: var(--page-muted);
    font-size: 12px;
  }
  @media (max-width: 860px) {
    .index { grid-template-columns: 1fr; }
    .boards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="masthead">
    <p class="kicker">Brand concepts</p>
    <h1>%%TITLE%%</h1>
    <p class="lede">%%SUBTITLE%%</p>
    <nav class="index" aria-label="Concepts">%%INDEX%%</nav>
  </header>
  %%CONCEPTS%%
  <footer class="footer">Each concept is one direction, not a variation. Pick one, ask for a revision, or ask for a fourth.</footer>
</main>
</body>
</html>
